# air live-reload config for Isopace (https://github.com/air-verse/air).
#
# air is a development-only tool, installed separately and NOT a module
# dependency:
#     go install github.com/air-verse/air@latest
#     air
#
# Isopace is a library; only the example programs run. This config targets the
# simulator test host (an issuer + an admin HTTP endpoint). To live-reload a
# different program, change [build].cmd / .bin / .args_bin, e.g. point them at
# ./examples/issuer.
#
# NOTE on the build output path: air resolves `bin` to an absolute path and
# splits it on spaces, so a project directory containing a space (this one is
# under ".../Teqpace - Projects/...") breaks the *run* step ("/bin/sh: ...: is a
# directory", exit 126). To avoid that we build the binary to /tmp, which has no
# spaces. The clean long-term fix is to keep the checkout in a space-free path.

root = "."
tmp_dir = "tmp"

[build]
  # Build to a space-free path so air can run it regardless of the repo location.
  cmd = "go build -o /tmp/isopace-sim ./examples/simulator"
  bin = "/tmp/isopace-sim"
  # Flags passed to the rebuilt binary on each run.
  args_bin = ["-addr", "127.0.0.1:8583", "-admin", "127.0.0.1:8584", "-limit", "10000"]
  include_ext = ["go", "toml", "json"]
  exclude_dir = ["tmp", "bin", "dist", "build", "docs", "conformance/testdata"]
  exclude_regex = ["_test\\.go"]
  delay = 500            # ms to wait after a change before rebuilding
  stop_on_error = true
  send_interrupt = true  # SIGINT the old process so the host shuts down gracefully
  kill_delay = "2s"

[misc]
  clean_on_exit = true
