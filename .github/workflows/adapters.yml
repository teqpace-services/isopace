name: Adapters

# The adapter modules live in their own go.mod files so the core module graph
# stays stdlib-only. They are not covered by the root CI's ./... , so build and
# test each one independently here.

on:
  push:
    branches: [main]
    paths:
      - 'adapters/**'
      - 'runtime/**'
      - 'store/**'
      - 'go.mod'
      - '.github/workflows/adapters.yml'
  pull_request:
    branches: [main]
    paths:
      - 'adapters/**'
      - 'runtime/**'
      - 'store/**'
      - 'go.mod'
      - '.github/workflows/adapters.yml'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [adapters/otel, adapters/sql, adapters/payshield]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Verify formatting
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Not gofmt-clean:"; echo "$fmt_out"; exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...

  pkcs11:
    name: adapters/pkcs11 (SoftHSM2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/pkcs11
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Install SoftHSM2 + OpenSC
        run: sudo apt-get update && sudo apt-get install -y softhsm2 opensc
      - name: Provision a SoftHSM2 token
        run: |
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm2.conf"
          mkdir -p "$RUNNER_TEMP/tokens"
          printf 'directories.tokendir = %s/tokens\nobjectstore.backend = file\nlog.level = ERROR\n' "$RUNNER_TEMP" > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --slot 0 --label isopace --pin 1234 --so-pin 5678
          # Resolve the module path and export both for the test step.
          module="$(dpkg -L libsofthsm2 2>/dev/null | grep -m1 'libsofthsm2.so' || echo /usr/lib/softhsm/libsofthsm2.so)"
          echo "SOFTHSM2_CONF=$SOFTHSM2_CONF" >> "$GITHUB_ENV"
          echo "ISOPACE_SOFTHSM_MODULE=$module" >> "$GITHUB_ENV"
      - name: Verify formatting
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Not gofmt-clean:"; echo "$fmt_out"; exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race, against SoftHSM2)
        env:
          ISOPACE_SOFTHSM_TOKEN: isopace
          ISOPACE_SOFTHSM_PIN: '1234'
        run: go test -race -v ./...
